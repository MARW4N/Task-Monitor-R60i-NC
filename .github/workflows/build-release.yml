name: Build and Release Taskbar Monitor

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build and Package Taskbar Monitor
      shell: pwsh
      run: |
        Write-Host "=== 1. Locate MSBuild using vswhere ==="
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
        }
        $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        if (!$msbuild -or !(Test-Path $msbuild)) {
            $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        }
        Write-Host "Using MSBuild: $msbuild"

        Write-Host "=== 2. Download latest official nuget.exe ==="
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
        Write-Host "Restoring NuGet packages..."
        .\nuget.exe restore TaskbarMonitor.sln

        Write-Host "=== 3. Compiling Taskbar Monitor Solution ==="
        & $msbuild TaskbarMonitor.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /m /v:m
        if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
        }

        Write-Host "=== 4. Prepare Installer Resources and Rebuild Installer ==="
        if (!(Test-Path "TaskbarMonitorInstaller/Resources")) {
            New-Item -ItemType Directory -Path "TaskbarMonitorInstaller/Resources" -Force
        }
        Copy-Item -Path "TaskbarMonitor/bin/Release/TaskbarMonitor.dll" -Destination "TaskbarMonitorInstaller/Resources/" -Force
        Copy-Item -Path "packages/Newtonsoft.Json.13.0.1/lib/net45/Newtonsoft.Json.dll" -Destination "TaskbarMonitorInstaller/Resources/Newtonsoft.Json.dll" -Force
        Copy-Item -Path "TaskbarMonitorWindows11/bin/Release/TaskbarMonitorWindows11.exe" -Destination "TaskbarMonitorInstaller/Resources/" -Force

        & $msbuild TaskbarMonitorInstaller/TaskbarMonitorInstaller.csproj /t:Rebuild /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

        Write-Host "=== 5. Packaging Release Files ==="
        New-Item -ItemType Directory -Path ./release_dist -Force
        Copy-Item -Path "TaskbarMonitorWindows11/bin/Release/TaskbarMonitorWindows11.exe" -Destination "./release_dist/" -Force
        Copy-Item -Path "TaskbarMonitor/bin/Release/TaskbarMonitor.dll" -Destination "./release_dist/" -Force
        Copy-Item -Path "packages/Newtonsoft.Json.13.0.1/lib/net45/Newtonsoft.Json.dll" -Destination "./release_dist/Newtonsoft.Json.dll" -Force
        if (Test-Path "TaskbarMonitorInstaller/bin/Release/TaskbarMonitorInstaller.exe") {
            Copy-Item -Path "TaskbarMonitorInstaller/bin/Release/TaskbarMonitorInstaller.exe" -Destination "./release_dist/" -Force
        }
        if (Test-Path "README.md") {
            Copy-Item -Path "README.md" -Destination "./release_dist/" -Force
        }
        if (Test-Path "INSTALL.txt") {
            Copy-Item -Path "INSTALL.txt" -Destination "./release_dist/" -Force
        }
        Compress-Archive -Path ./release_dist/* -DestinationPath ./TaskbarMonitor-Windows11-Soundcore.zip -Force
        Write-Host "Packaging complete."

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TaskbarMonitor-Windows11-Soundcore
        path: |
          ./release_dist/*
          ./TaskbarMonitor-Windows11-Soundcore.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v0.5.4-soundcore"
        name: "Taskbar Monitor with Soundcore Earbuds Battery Support"
        draft: false
        prerelease: false
        files: |
          ./release_dist/TaskbarMonitorWindows11.exe
          ./release_dist/TaskbarMonitorInstaller.exe
          ./TaskbarMonitor-Windows11-Soundcore.zip
        body: |
          ## Taskbar Monitor with Soundcore P40i / R60i Battery Support
          
          ### Download Options:
          - **`TaskbarMonitorWindows11.exe`**: Ready-to-run Windows 11 standalone app. Docks into your taskbar beside the clock and system tray.
          - **`TaskbarMonitorInstaller.exe`**: 1-click self-extracting installer for Windows 11 and 10.
          - **`TaskbarMonitor-Windows11-Soundcore.zip`**: Complete archive including DLLs, manual batch files, and documentation.
          
          ### Quick Setup:
          1. Run **`TaskbarMonitorWindows11.exe`** (or `TaskbarMonitorInstaller.exe`).
          2. Right-click the widget on your taskbar $\to$ **Options...** $\to$ **SOUNDCORE BATTERY**.
          3. Confirm your Bluetooth MAC address (`34:09:C9:AD:A9:20`) and `openscq30.exe` path.
          4. Click **Test Connection** and click **Apply**!
